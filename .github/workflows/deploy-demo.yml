name: Deploy demo

# Publishes a redirect to the demo's new home, https://agent.dudko.dev/demo/, on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The demo moved to https://agent.dudko.dev/demo/ (the dudko-dev/agents monorepo). This site
      # now serves only a redirect there, also for unknown paths (404.html), so the links in the
      # READMEs of already published package versions keep working.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
